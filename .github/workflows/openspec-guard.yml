name: OpenSpec Guard

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  openspec-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install official OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: Set up PowerShell
        shell: bash
        run: pwsh --version

      - name: Run shared local gate
        shell: pwsh
        run: ./tools/ci/local_gate.ps1 -RefreshManagedFiles -RequireCleanGit -Json | Tee-Object -FilePath local-gate-report.json

      - name: Upload local gate JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-gate-report
          path: |
            local-gate-report.json
            openspec-guard-report.json
